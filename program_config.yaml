          ring_fuel: ["p11b", "lib_equal", "lib_nat_li", "b11_target"]
        flag_template: "--base-fuel {base_fuel} --fuel-rod --rod-fuel {rod_fuel} --fuel-ring-full --ring-fuel {ring_fuel}"
