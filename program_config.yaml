        - "Roth, M."
        - "Vay, J.-L."
      preferred_journals:
        - "Physics of Plasmas"
        - "Nature Communications"
      required_topic_coverage:
        - "p-11B fuel preparation"
        - "ammonia borane plasma sources"
        - "multi-zone target design"
      verification_strict: true
    
    deliverables:
      - manuscript
      - references
      - press_release
      - lay_summary
      - metadata
      - potential_claims
      - uniqueness_review
    
    internal_patent_strategy:
