      framing:
        problem: "Ring-reconnection geometry has three distinct fuel zones (base, central rod, outer ring) and many fuel choices for each. Identifying the optimal combination requires systematic parameter scan."
        contribution: "Two-phase optimization (preflight scan + production validation) of 32 fuel combinations identifies the top 5 configurations. Ammonia borane central rod is a consistent feature of high-yield configurations."
