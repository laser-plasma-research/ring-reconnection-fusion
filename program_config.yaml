      command: "mpirun -n {mpi_ranks} python3 pb11_ring_reconnection_v12_fuel_center_outer.py --base-fuel p11b --b-seed 300 --outdir {outdir} {test_flag}"
      depends_on: [p1_static_p11b]
      estimated_runtime_hours: 18
      output_dir_pattern: "runs/paper{paper_num:02d}/{mode}/{sub_tag}"
