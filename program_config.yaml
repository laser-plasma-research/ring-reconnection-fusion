        - {sub_tag: "p3_rod_p11b", flags_override: "--base-fuel p11b --fuel-rod --rod-fuel p11b --rod-density 5e24"}
        - {sub_tag: "p3_rod_sweep_5e23", flags_override: "--base-fuel p11b --fuel-rod --rod-fuel ammonia_borane --rod-density 5e23"}
        - {sub_tag: "p3_rod_sweep_5e24", flags_override: "--base-fuel p11b --fuel-rod --rod-fuel ammonia_borane --rod-density 5e24"}
        - {sub_tag: "p3_rod_sweep_5e25", flags_override: "--base-fuel p11b --fuel-rod --rod-fuel ammonia_borane --rod-density 5e25"}
        - {sub_tag: "p3_rod_sweep_5e26", flags_override: "--base-fuel p11b --fuel-rod --rod-fuel ammonia_borane --rod-density 5e26"}
    
