# ============================================================================
# program_config.yaml
# Ring-Reconnection Plasma Research Program
# 
# Single source of truth for the orchestrator covering:
#   - Program-level settings (paths, defaults, visibility rules)
#   - Deliverable type definitions (12 deliverable types fully specified)
#   - Figure registry (reusable figure specifications)
#   - Per-paper definitions (current 10-paper Programme A)
# 
# US English throughout. All file paths use forward slashes.
# Last updated: 2026-04-26
# ============================================================================


# ============================================================================
# PROGRAM-LEVEL SETTINGS
# ============================================================================

program:
  name: "Ring-Reconnection Plasma Research"
  org: "laser-plasma-research"
  default_max_parallel: 2
  default_mpi_ranks: 8
  
  paths:
    program_root: "~/research/laser-plasma-research"
    shared: "~/research/laser-plasma-research/shared"
    runs_root: "./runs"
  
  # ---- Visibility classification ----
  # Generated .gitignore is derived from these patterns.
  # public_paths: tracked by Git, pushed to GitHub
  # private_paths: gitignored, stays local only
  # always_private: hard-coded credentials/secrets, cannot be made public
  # Files matching neither default to private (default-deny).
  visibility:
    public_paths:
      - "README.md"
      - "LICENSE"
      - "DATA_LICENSE"
      - "CITATION.cff"
      - ".gitignore"
      - "paper/**"
      - "simulation/**"
      - "analysis/**"
      - "data/**/README.md"
      - "data/**/.gitignore"
      - "figures/**"
      - "docs/**"
      - "scripts/**"
      - "tests/**"
      - ".github/**"
      - "metadata/**"
      - "companion/public/**"
      - "companion/partner/**"
      - "outreach/public/**"
    
    private_paths:
      - "ip_analysis/**"
      - "companion/internal/**"
      - "outreach/internal/**"
      - "market_intelligence/**"
      - "patent_strategy/**"
      - "working_notes/**"
      - "*.private.md"
      - "**/*.private.md"
      - "deliverables_preflight/**"
    
    always_private:
      - ".env"
      - ".env.*"
      - "*.token"
      - "*_secret.txt"
      - "secrets/"
      - "credentials/"
      - "*.api_key"
  
  # ---- AI orchestrator settings ----
  drafting:
    default_model: "claude-opus-4-6"
    default_language: "en"
    api_key_env_var: "ANTHROPIC_API_KEY"
    max_retries: 2
    api_timeout_seconds: 300
    
    # Preflight mode: cheaper/faster model and shorter outputs to validate
    # the pipeline before committing to full production runs.
    preflight:
      model: "claude-sonnet-4-6"
      length_factor: 0.1   # produces 10% of normal length
      skip_citation_verification: true
  
  # ---- Citation strategy global defaults ----
  # Per-paper citation_strategy block can override these.
  citation:
    default_target_count: 30
    minimum_acceptable_count: 20
    crossref_api: "https://api.crossref.org"
    openalex_api: "https://api.openalex.org"
    semantic_scholar_api: "https://api.semanticscholar.org"
    verification_strict: true   # refuse to include unverified citations
    
    # Citation visibility strategy: prefer citing high-impact recent work
    # by authors active in the field. Maximizes citation-alert reach.
    visibility_strategy:
      prefer_recent_years: 5            # weight last 5 years higher
      prefer_high_citation_count: true  # h-index proxy
      prefer_target_journals: true      # journals reviewers frequent
      max_self_citations: 3             # don't over-cite own work


# ============================================================================
# JOURNAL PROFILES
# ============================================================================
# Per-journal formatting and submission requirements.
# Looked up by paper.target_journal. Deliverables use these to format output.

journal_profiles:
  
  "Physics of Plasmas":
    publisher: "AIP Publishing"
    latex_class: "revtex4-2"
    citation_style: "aps"
    bibtex_style: "apsrev4-2"
    typical_words: 6500
    max_words: 12000
    figure_format: "pdf"
    column_width_mm: 89
    audience: "plasma physicists familiar with PIC simulation methods"
    requires_competing_interests: true
    requires_data_availability: true
    requires_orcid: true
  
  "Spectrochimica Acta Part B":
    publisher: "Elsevier"
    latex_class: "elsarticle"
    citation_style: "elsarticle-num"
    bibtex_style: "elsarticle-num"
    typical_words: 5500
    max_words: 8000
    figure_format: "pdf"
    column_width_mm: 86
    audience: "analytical chemists with LIBS or atomic spectroscopy expertise"
    requires_competing_interests: true
    requires_data_availability: true
    requires_orcid: true
  
  "Nuclear Fusion":
    publisher: "IOP Publishing"
    latex_class: "iopart"
    citation_style: "iopart-num"
    bibtex_style: "unsrt"
    typical_words: 7000
    max_words: 14000
    figure_format: "pdf"
    column_width_mm: 84
    audience: "fusion physics researchers"
    requires_competing_interests: true
    requires_data_availability: true
    requires_orcid: true
  
  "Physical Review Letters":
    publisher: "American Physical Society"
    latex_class: "revtex4-2"
    citation_style: "aps"
    bibtex_style: "apsrev4-2"
    typical_words: 3500
    max_words: 3750   # PRL hard cap
    figure_format: "pdf"
    column_width_mm: 89
    audience: "broad physics readership"
    requires_competing_interests: true
    requires_data_availability: true
    requires_orcid: true
  
  "Review of Scientific Instruments":
    publisher: "AIP Publishing"
    latex_class: "revtex4-2"
    citation_style: "aps"
    bibtex_style: "apsrev4-2"
    typical_words: 6000
    max_words: 10000
    figure_format: "pdf"
    column_width_mm: 89
    audience: "experimental physicists building or operating instruments"
    requires_competing_interests: true
    requires_data_availability: true
    requires_orcid: true


# ============================================================================
# FIGURE REGISTRY
# ============================================================================
# Reusable figure type definitions. Per-paper analysis.figures references
# these by type name. Allows consistent figure styling across papers while
# letting each paper specify its own figure ordering and naming.

figure_registry:
  
  fig_ring_geometry:
    description: "Schematic of N-spot ring geometry with X-line markers"
    generator: "schematic"
    width_mm: 89
    type: "diagram"
    requires_input: []
  
  fig_bfield_evolution:
    description: "Magnetic field max and mean over simulation time"
    generator: "field_timeseries"
    width_mm: 89
    type: "data"
    requires_input: ["fields/B"]
    standard_caption: "Magnetic field evolution over the simulation duration. Top panel shows |B|_max; bottom panel shows |B|_mean."
  
  fig_xline_depletion:
    description: "X-line vs ring B-field ratio over time"
    generator: "spatial_zone_analysis"
    width_mm: 89
    type: "data"
    requires_input: ["fields/B"]
    standard_caption: "X-line magnetic field depletion: ratio of mean |B| in X-line zone vs ring zone over time."
  
  fig_centre_outer_energy:
    description: "Centre vs outer 95th percentile proton energy over time"
    generator: "particle_energy_zones"
    width_mm: 89
    type: "data"
    requires_input: ["particles/proton"]
    standard_caption: "Centre vs outer proton energy comparison: 95th percentile energy in centre region (r < 200 um) vs outer region."
  
  fig_proton_energy_distribution:
    description: "Proton energy distribution function evolution"
    generator: "particle_distribution"
    width_mm: 89
    type: "data"
    requires_input: ["particles/proton"]
    standard_caption: "Proton energy distribution at selected times showing development of suprathermal tail."
  
  fig_density_profile:
    description: "2D density profile snapshots"
    generator: "field_2d_snapshots"
    width_mm: 180   # double column
    type: "data"
    requires_input: ["fields/rho"]
    standard_caption: "Density evolution showing plume formation and convergence dynamics."
  
  fig_frequency_response:
    description: "Frequency response curve (centre energy vs rotation frequency)"
    generator: "frequency_scan"
    width_mm: 89
    type: "data"
    requires_input: ["multiple_runs"]
    standard_caption: "Centre proton 95th percentile energy as a function of rotation frequency, showing Alfvén sub-harmonic resonance peaks."
  
  fig_b_seed_sensitivity:
    description: "B-field sensitivity scan results"
    generator: "parameter_scan"
    width_mm: 89
    type: "data"
    requires_input: ["multiple_runs"]
    standard_caption: "Centre proton energy vs Biermann seed field strength."
  
  fig_rod_density_scan:
    description: "Central rod density parameter scan"
    generator: "parameter_scan"
    width_mm: 89
    type: "data"
    requires_input: ["multiple_runs"]
    standard_caption: "Effect of central rod fuel density on centre proton energy and X-line dynamics."
  
  fig_outer_ring_comparison:
    description: "Outer ring catcher geometry comparison"
    generator: "geometry_comparison"
    width_mm: 89
    type: "data"
    requires_input: ["multiple_runs"]
    standard_caption: "Comparison of outer ring catcher geometries: inner face only, outer face only, full annulus."
  
  fig_lib_fuel_comparison:
    description: "Lithium-boron fuel comparison"
    generator: "fuel_comparison"
    width_mm: 89
    type: "data"
    requires_input: ["multiple_runs"]
    standard_caption: "Centre proton energy and yield estimates across LiB fuel compositions."
  
  fig_optimization_matrix:
    description: "Optimization matrix heatmap"
    generator: "matrix_heatmap"
    width_mm: 180
    type: "data"
    requires_input: ["paper6_runs"]
    standard_caption: "Optimization matrix: centre proton energy across base/rod/ring fuel combinations."
  
  fig_yield_projection:
    description: "Engineering yield projection chart"
    generator: "engineering_projection"
    width_mm: 180
    type: "data"
    requires_input: ["multiple_runs"]
    standard_caption: "Projected alpha yield per shot scaling from current simulation regime to commercial-class hardware."
  
  fig_z_following:
    description: "Z-following multi-pulse construction"
    generator: "schematic_with_data"
    width_mm: 89
    type: "diagram"
    requires_input: ["multiple_runs"]
    standard_caption: "Z-following volumetric construction: N=1, 2, 4, 8 pulse arrangement and resulting energy enhancement."
  
  fig_experimental_baseline:
    description: "Experimental configuration validation"
    generator: "experimental_layout"
    width_mm: 89
    type: "diagram"
    requires_input: ["fields", "particles"]
    standard_caption: "Predicted experimental signatures for proposed validation campaign."


# ============================================================================
# DELIVERABLE TYPES
# ============================================================================
# Each deliverable type is fully specified once at program level.
# Per-paper deliverables list just names which types to produce.
# Drafting context provided per paper supplies the variables.

deliverable_types:
  
  # ----------------------------------------------------------------------
  # MANUSCRIPT — the peer-reviewed paper itself
  # ----------------------------------------------------------------------
  manuscript:
    output_path: "paper/manuscript.tex"
    visibility: public
    format: "latex"
    
    prompt:
      system: |
        You are drafting a peer-reviewed scientific manuscript for the
        target journal specified. Maintain rigorous technical tone with
        appropriate hedging for simulation-only results. Use standard
        paper structure: Abstract, Introduction, Method, Results,
        Discussion, Conclusions. Cite references using standard journal
        format. Reference figures using \ref{} commands.
        
        Treat the simulation as preliminary computational evidence
        unless experimental validation is explicitly cited. Avoid
        promotional language. State limitations honestly.
      
      user_template: |
        Draft a manuscript for the following research:
        
        Title: {title}
        Target journal: {target_journal}
        Target word count: {drafting_context.target_words}
        Tone: {drafting_context.tone}
        
        Research framing:
        - Problem: {drafting_context.framing.problem}
        - Contribution: {drafting_context.framing.contribution}
        - Limitations: {drafting_context.framing.limitations}
        
        Key results to emphasize (in order of importance):
        {drafting_context.key_results_to_emphasize}
        
        Simulation results to incorporate (from analysis/stats/):
        {analysis_outputs}
        
        Available figures to reference:
        {figures_with_captions}
        
        Draft the following sections in standard order:
        - Abstract (250 words, structured)
        - Introduction
        - Method
        - Results
        - Discussion
        - Conclusions
        
        Include placeholder references using \cite{key} format.
        Actual references.bib will be generated separately.
        
        Output format: complete LaTeX manuscript using {latex_class} class.
      
      forbidden_content:
        - "Patent claim numbers (e.g. 'Claim 1', 'Claim 33')"
        - "Gain lever references (e.g. 'Lever 4', 'gain stack')"
        - "Commercial protection language"
        - "Specific licensee company names in promotional context"
        - "Marketing or promotional adjectives ('groundbreaking', 'revolutionary', 'first-ever')"
        - "Unhedged claims about commercial viability"
      
      required_content:
        - "Standard paper structure: Abstract, Introduction, Method, Results, Discussion, Conclusions"
        - "Code and Data Availability section (with placeholder GitHub URL and Zenodo DOI)"
        - "Competing Interests section acknowledging patent application exists (one neutral sentence)"
        - "Figure references using \\ref{} commands"
        - "Citation references using \\cite{} commands"
        - "All quantitative results sourced from analysis_outputs"
        - "Limitations explicitly stated in Discussion"
      
      model: "claude-opus-4-6"
      max_tokens: 8192
      temperature: 0.3
  
  
  # ----------------------------------------------------------------------
  # REFERENCES — the bibliography
  # Strategically selected and verified against citation databases
  # ----------------------------------------------------------------------
  references:
    output_path: "paper/references.bib"
    visibility: public
    format: "bibtex"
    
    # References has a special handler that's not just a Claude API call.
    # Pipeline:
    #   1. Citation discovery via OpenAlex/Crossref/Semantic Scholar APIs
    #   2. Author identification (high-impact authors in target community)
    #   3. Relevance scoring (matches manuscript topics)
    #   4. Visibility scoring (citation count, recency, target journal match)
    #   5. Selection by Claude based on scored candidates
    #   6. DOI verification against Crossref API
    #   7. BibTeX generation
    handler: "references_strategic"
    
    prompt:
      system: |
        You are selecting and arranging citations for a scientific
        manuscript. The candidates have been pre-filtered for relevance
        and verified for existence. Select the citations that best:
        
        1. Support the methodology and conclusions (scientific completeness)
        2. Acknowledge prior work in the specific subfield (defensive positioning)
        3. Cite authors whose work the paper engages with substantively
           (visibility — these authors will receive citation alerts)
        
        Prefer recent influential work over older dated work, except for
        foundational references that must be acknowledged. Prefer authors
        and journals on the citation_strategy.preferred lists when
        candidates are otherwise equivalent.
      
      user_template: |
        Select citations for this manuscript:
        
        Manuscript text: {manuscript_text}
        
        Citation strategy:
        - Target count: {citation_strategy.target_count}
        - Key authors to cite: {citation_strategy.key_authors_to_cite}
        - Preferred journals: {citation_strategy.preferred_journals}
        - Required topic coverage: {citation_strategy.required_topic_coverage}
        
        Verified candidates (each with DOI, title, authors, year, journal,
        citation count, abstract):
        {verified_candidates}
        
        Select {citation_strategy.target_count} citations that best serve
        scientific completeness, defensive positioning, and visibility.
        For each selected citation, identify which paragraphs of the
        manuscript would cite it.
        
        Output format: BibTeX entries plus a citation_map showing which
        manuscript sections cite each entry.
      
      forbidden_content:
        - "Citations not present in the verified_candidates list"
        - "Modified DOIs or made-up references"
      
      required_content:
        - "All citations have valid DOI from verified_candidates"
        - "Coverage of all required_topic_coverage topics"
        - "At least one citation for each key_authors_to_cite where available"
        - "Properly formatted BibTeX matching journal style"
      
      model: "claude-opus-4-6"
      max_tokens: 8192
      temperature: 0.2
  
  
  # ----------------------------------------------------------------------
  # PRESS_RELEASE — for science journalists
  # ----------------------------------------------------------------------
  press_release:
    output_path: "companion/public/press_release_{language}.md"
    visibility: public
    format: "markdown"
    
    prompt:
      system: |
        You are writing a science press release for journalists. The
        goal is to make a technical research result accessible and
        newsworthy without sacrificing accuracy. Lead with the hook
        (why this matters), then provide enough detail for a journalist
        to write a story without further research.
      
      user_template: |
        Write a press release in {language} for:
        
        Research: {title}
        Target audience: General science readers
        Length: 500-700 words
        Headline finding: {drafting_context.headline_finding}
        Significance: {drafting_context.framing.contribution}
        
        Required structure:
        - Suggested headlines (3 options, varying angles)
        - Dateline ([CITY, DATE])
        - Lead paragraph (1-2 sentences: hook + significance)
        - Background (2-3 sentences: context for non-experts)
        - Key findings (3-4 sentences with specific quantitative results)
        - Significance paragraph (why this matters, what it enables)
        - Quote from author (mark as [AUTHOR QUOTE PLACEHOLDER] if not provided)
        - Methodology summary (1-2 sentences accessible to non-experts)
        - What's next (1-2 sentences on planned follow-up work)
        - About / contact information section
        
        Quantitative results from analysis: {analysis_outputs}
      
      forbidden_content:
        - "Technical jargon without immediate plain-language explanation"
        - "Equations or mathematical notation"
        - "Patent claim references or numbers"
        - "Commercial licensing language"
        - "Speculation beyond what results support"
        - "Disparaging references to competitor companies"
        - "Made-up author quotes (use placeholder)"
        - "Marketing superlatives ('revolutionary', 'breakthrough', 'world-first')"
      
      required_content:
        - "Specific quantitative results drawn from analysis_outputs"
        - "Hook in the first sentence"
        - "Author quote or [AUTHOR QUOTE PLACEHOLDER]"
        - "Author name, affiliation, contact email"
        - "Reference to GitHub URL and Zenodo DOI for code/data"
      
      model: "claude-opus-4-6"
      max_tokens: 1500
      temperature: 0.5   # slightly creative for prose
  
  
  # ----------------------------------------------------------------------
  # LAY_SUMMARY — for general audiences and ongoing outreach
  # ----------------------------------------------------------------------
  lay_summary:
    output_path: "companion/public/lay_summary_{language}.md"
    visibility: public
    format: "markdown"
    
    prompt:
      system: |
        You are writing a plain-language summary of scientific research
        for a general audience (high school graduate reading level).
        Avoid jargon, explain technical concepts using analogies,
        emphasize why this matters in the world. Different from a press
        release: lay summaries are evergreen, used in funding applications,
        ORCID profiles, university web pages, science outreach.
      
      user_template: |
        Write a lay summary in {language} for:
        
        Research: {title}
        Length: 300-400 words
        Reading level: high school graduate
        
        Structure (no headings, just flowing prose):
        - What is the problem we're trying to solve?
        - What did we do?
        - What did we find?
        - Why does this matter?
        
        Research details: {analysis_outputs}
        Significance: {drafting_context.framing.contribution}
      
      forbidden_content:
        - "Equations or mathematical notation"
        - "Technical jargon without analogy or definition"
        - "Patent or commercial language"
        - "Self-aggrandizing language"
      
      required_content:
        - "Plain-language explanation suitable for high school reader"
        - "Specific quantitative results with units"
        - "Clear statement of why this matters"
      
      model: "claude-opus-4-6"
      max_tokens: 1024
      temperature: 0.5
  
  
  # ----------------------------------------------------------------------
  # CONFERENCE_ABSTRACT — for paper submissions to conferences
  # ----------------------------------------------------------------------
  conference_abstract:
    output_path: "companion/public/conference_abstract_{event}_{language}.md"
    visibility: public
    format: "markdown"
    
    prompt:
      system: |
        You are writing a conference abstract for paper submission.
        Conference abstracts are concise, technical, follow specific
        structure (background, methods, results, conclusions), and
        target field specialists who will be at the conference.
      
      user_template: |
        Write a conference abstract for:
        
        Research: {title}
        Target conference: {drafting_context.target_event}
        Length: 250 words (firm)
        Audience: domain specialists at the conference
        
        Structure:
        - Background (1-2 sentences)
        - Methods (2-3 sentences)
        - Results (3-4 sentences with specific numbers)
        - Conclusions (1-2 sentences)
        
        Research details: {analysis_outputs}
      
      forbidden_content:
        - "Marketing language"
        - "Patent references"
        - "Speculation beyond data"
      
      required_content:
        - "Exactly within target word count (or marked over)"
        - "Specific quantitative results with units"
        - "Clear methods summary"
      
      model: "claude-opus-4-6"
      max_tokens: 800
      temperature: 0.3
  
  
  # ----------------------------------------------------------------------
  # INDUSTRY_BRIEF — for commercial decision-makers
  # ----------------------------------------------------------------------
  industry_brief:
    output_path: "companion/partner/industry_brief.md"
    visibility: public   # in repo, but flagged as partner-tier
    format: "markdown"
    
    prompt:
      system: |
        You are writing a technical capability brief for industry
        decision-makers (R&D heads, business development, technical
        buyers). The goal is to convey what the technology does, what
        performance has been demonstrated, what applications it
        enables, and how to engage further. Avoid academic framing;
        focus on commercial application. Be specific about what the
        technology achieves and what limitations remain.
      
      user_template: |
        Write a technical capability brief for:
        
        Technology: {title}
        Primary application: {drafting_context.primary_application}
        Length: 800-1200 words (approximately 2 pages)
        Audience: industry R&D, business development, technical buyers
        
        Required structure:
        - Executive summary (3-5 sentences)
        - Technology description (2 paragraphs accessible to engineers)
        - Application areas (specific commercial uses)
        - Performance characteristics (with specific metrics and units)
        - Comparison to existing solutions (where data is available)
        - Technology readiness level (TRL): {drafting_context.trl_level}
        - Commercial readiness assessment
        - Engagement path (how to discuss licensing or collaboration)
        
        Performance data: {analysis_outputs}
        Industry context: {drafting_context.industry_context}
      
      forbidden_content:
        - "Specific patent claim numbers or strategic IP details"
        - "Specific royalty rates or commercial terms"
        - "Speculation about regulatory approval timelines"
        - "Made-up market size numbers (must be sourced)"
        - "Disparaging comparisons to specific competitors"
      
      required_content:
        - "TRL level with justification"
        - "Specific performance metrics with units"
        - "Comparison or context vs current alternatives"
        - "Brief acknowledgment that IP protection exists (one sentence, no specifics)"
        - "Contact information for licensing/collaboration inquiries"
      
      model: "claude-opus-4-6"
      max_tokens: 4096
      temperature: 0.3
  
  
  # ----------------------------------------------------------------------
  # VC_BRIEFING — internal investor-facing material
  # ----------------------------------------------------------------------
  vc_briefing:
    output_path: "companion/internal/vc_briefing.md"
    visibility: internal   # gitignored
    format: "markdown"
    
    prompt:
      system: |
        You are writing an investor-facing briefing for venture capital
        due diligence. The audience is sophisticated investors evaluating
        deep tech opportunities. Cover technology, IP, market, team, and
        risk transparently. This is an INTERNAL document — full IP
        discussion is appropriate; specific patent claim references and
        strategic positioning are allowed. Do not exaggerate; investors
        detect hyperbole and discount proportionally.
      
      user_template: |
        Write a VC briefing for:
        
        Technology: {title}
        IP context: {internal_patent_strategy}
        Target markets: {drafting_context.target_markets}
        Length: 4-6 pages (~3000-4000 words)
        
        Required structure:
        - Executive summary (1 page)
        - Technology overview (technical but accessible)
        - Market opportunity with specific sizing
        - Competitive positioning
        - IP estate including this paper's contribution to claims defense
        - Team and capability
        - Risk assessment (technical, market, IP, regulatory)
        - Funding requirements with use-of-funds breakdown
        - Milestones to next inflection point
        
        This is an INTERNAL document. Full IP details and strategic
        positioning are appropriate.
        
        Research data: {analysis_outputs}
      
      forbidden_content:
        - "Inaccurate market size claims (must cite source)"
        - "Speculative competitor financial details (only verified public info)"
        - "Made-up team member names or backgrounds"
        - "Promised outcomes (use 'targeted', 'projected', 'aim to')"
      
      required_content:
        - "Specific market size with sources"
        - "Specific patent claims defended (drawn from internal_patent_strategy)"
        - "Honest risk assessment, not just upside framing"
        - "Use-of-funds breakdown"
      
      model: "claude-opus-4-6"
      max_tokens: 8192
      temperature: 0.3
  
  
  # ----------------------------------------------------------------------
  # POTENTIAL_CLAIMS — patent attorney briefing on new matter
  # ----------------------------------------------------------------------
  potential_claims:
    output_path: "ip_analysis/potential_claims.md"
    visibility: internal   # gitignored
    format: "markdown"
    
    prompt:
      system: |
        You are an analyst supporting patent prosecution. Read the paper
        and the existing PPA disclosure (provided). Identify any
        potentially patentable subject matter in the paper that goes
        beyond what the PPA already discloses. Output is intended to
        brief a patent attorney for follow-up consultation. Be careful
        not to overclaim; flag uncertainty for attorney review.
      
      user_template: |
        Analyze the following paper for patentable subject matter:
        
        Paper draft: {manuscript_text}
        Existing PPA reference: {v4_ppa_excerpt}
        
        For each technical contribution in the paper, assess:
        1. What is the contribution?
        2. Is it disclosed in the existing PPA?
        3. If new, what type of claim could cover it (method, system, apparatus)?
        4. Is the contribution novel and non-obvious vs prior art cited in paper?
        5. Tentative claim language (clearly marked as preliminary)
        6. Filing strategy recommendation (continuation-in-part, defensive
           publication, defer, etc.)
        
        Output format: structured markdown with sections per contribution.
        Each section ends with "Attorney consultation recommended: YES/NO".
      
      forbidden_content:
        - "Definitive patentability opinions (this is preliminary analysis)"
        - "Specific claim language presented as final"
      
      required_content:
        - "Each technical contribution analyzed individually"
        - "Coverage assessment vs existing PPA"
        - "Attorney consultation recommendation flag for each"
      
      model: "claude-opus-4-6"
      max_tokens: 4096
      temperature: 0.2   # conservative for legal-adjacent analysis
  
  
  # ----------------------------------------------------------------------
  # LICENSING_TARGETS — industry licensee research
  # ----------------------------------------------------------------------
  licensing_targets:
    output_path: "ip_analysis/licensing_targets.md"
    visibility: internal   # gitignored
    format: "markdown"
    
    prompt:
      system: |
        You are researching potential licensees for technology described
        in the paper. Identify specific companies whose products or
        roadmaps would benefit from this technology. For each, provide
        contact strategy and engagement priority. Be specific (named
        companies, not generic categories). Acknowledge uncertainty
        where you have limited visibility into a company's current
        priorities.
      
      user_template: |
        Identify licensing targets for:
        
        Technology: {title}
        Application area: {drafting_context.primary_application}
        Application sectors: {drafting_context.licensee_categories}
        
        For each candidate company, provide:
        - Company name and headquarters location
        - Relevant business unit or product line
        - Why this technology matters to them (specific use case)
        - Suggested initial contact role (R&D head, BD, IP licensing)
        - Existing relationship or warm introduction path (if any)
        - Approach priority (high/medium/low)
        - Estimated likely deal structure (technology license, joint
          development, equity exchange)
        - Typical procurement cycle for similar partnerships
        - Notes on company current state (financial, M&A, leadership)
        
        Output format: ranked list with one company per section.
        
        Research findings: {analysis_outputs}
      
      forbidden_content:
        - "Made-up company names or details"
        - "Confidential information not from public sources"
        - "Disparaging characterizations of companies"
      
      required_content:
        - "Specific company names with verifiable details"
        - "Public-source justification for each"
        - "Approach priority based on stated criteria"
      
      model: "claude-opus-4-6"
      max_tokens: 4096
      temperature: 0.3
  
  
  # ----------------------------------------------------------------------
  # VALUATION — patent valuation supporting commercial conversations
  # ----------------------------------------------------------------------
  valuation:
    output_path: "ip_analysis/valuation.md"
    visibility: internal   # gitignored
    format: "markdown"
    
    prompt:
      system: |
        You are producing a structured patent valuation analysis for
        the patent estate's contribution from this paper. Use standard
        IP valuation methodology (income approach, market approach,
        cost approach). Cite sources for all market size and royalty
        rate assumptions. Distinguish clearly between supported facts
        and assumptions. Output supports VC due diligence and
        licensing discussions.
      
      user_template: |
        Produce valuation analysis for:
        
        Technology: {title}
        Patent claims defended: {internal_patent_strategy.defends_claims}
        Application markets: {drafting_context.target_markets}
        
        Structure:
        - Patent claim coverage map (which claims this paper defends)
        - Markets addressed by these claims (with sizing and sources)
        - Royalty rate assumptions (with industry benchmarks cited)
        - Penetration scenarios (conservative, moderate, aggressive)
        - Risk-adjusted NPV per scenario
        - Comparable transaction benchmarks (with sources)
        - Assumptions worksheet (every assumption listed with confidence)
        
        Use standard IP valuation methodology. Show all work.
        
        Research data: {analysis_outputs}
      
      forbidden_content:
        - "Single-number valuations without scenario analysis"
        - "Market size claims without source citations"
        - "Royalty rate assumptions without industry benchmarks"
      
      required_content:
        - "Three penetration scenarios"
        - "All assumptions explicitly listed"
        - "Comparable transactions with sources"
        - "Confidence levels on key inputs"
      
      model: "claude-opus-4-6"
      max_tokens: 4096
      temperature: 0.2
  
  
  # ----------------------------------------------------------------------
  # UNIQUENESS_REVIEW — novelty assessment vs prior art
  # ----------------------------------------------------------------------
  uniqueness_review:
    output_path: "ip_analysis/uniqueness_review.md"
    visibility: internal   # gitignored
    format: "markdown"
    
    prompt:
      system: |
        You are assessing the novelty of technical contributions in this
        paper against prior art. For each specific claim the paper
        makes, find the closest prior work and assess whether the paper's
        contribution is foundational, substantial, incremental, or
        replicative. The output gates publication and prosecution
        decisions; be honest about novelty rather than aspirational.
      
      user_template: |
        Assess novelty of:
        
        Paper: {title}
        Specific technical claims: {drafting_context.key_results_to_emphasize}
        Citation candidates: {verified_candidates}
        
        For each technical claim, provide:
        1. Claim summary (1-2 sentences)
        2. Closest prior work identified
        3. Distinguishing features
        4. Novelty classification:
           - foundational (genuinely new direction)
           - substantial (significant advance over prior art)
           - incremental (modest extension of prior work)
           - replicative (reproduces prior work in new conditions)
        5. Defensive value (would prior art likely be cited against
           a related patent claim during prosecution)
        6. Citations the paper should add to acknowledge prior work
        
        Output format: one section per claim. Conclude with overall
        novelty assessment and impact prediction (citation count range).
      
      forbidden_content:
        - "Inflated novelty claims unsupported by analysis"
        - "Citations to non-existent papers"
      
      required_content:
        - "Each claim assessed against specific prior work"
        - "Novelty classification with justification"
        - "Honest impact prediction"
      
      model: "claude-opus-4-6"
      max_tokens: 4096
      temperature: 0.2
  
  
  # ----------------------------------------------------------------------
  # METADATA — Schema.org JSON-LD and Crossref-ready metadata
  # ----------------------------------------------------------------------
  metadata:
    output_path: "metadata/paper.jsonld"
    visibility: public
    format: "json"
    
    # Special handler — generates structured metadata files, not prose.
    # Files produced:
    #   metadata/schema_org.jsonld
    #   metadata/dublin_core.xml
    #   metadata/crossref_deposit.xml (placeholder until DOI minted)
    #   metadata/related_works.yaml
    #   metadata/keywords.txt
    handler: "metadata_structured"
    
    prompt:
      system: |
        You are generating semantic metadata for indexing services
        (Google Scholar, Semantic Scholar, OpenAlex, Crossref). Output
        must be machine-parseable and accurate. Follow Schema.org
        conventions for ScholarlyArticle and SoftwareSourceCode types.
      
      user_template: |
        Generate metadata for:
        
        Title: {title}
        Authors: {authors}
        ORCID: {orcid}
        Target journal: {target_journal}
        Abstract: {abstract}
        Keywords (paper-specific): {drafting_context.keywords}
        Related works: {citation_strategy.key_authors_to_cite}
        Subject classification: {drafting_context.subject_classifications}
        
        Generate:
        - schema_org.jsonld (ScholarlyArticle type)
        - dublin_core.xml (DC metadata)
        - keywords.txt (10-15 keywords for indexing)
        - plain_language_abstract.md (separate from technical abstract)
        - related_works.yaml (semantic relationships to other papers)
      
      forbidden_content:
        - "Made-up author names or affiliations"
        - "Fabricated DOIs"
        - "Invalid JSON-LD or XML"
      
      required_content:
        - "Valid Schema.org ScholarlyArticle structure"
        - "Author ORCID linked"
        - "GitHub URL and Zenodo DOI placeholder"
        - "Subject classifications matching journal expectations"
      
      model: "claude-opus-4-6"
      max_tokens: 4096
      temperature: 0.1


# ============================================================================
# PAPERS — current 10-paper Programme A
# ============================================================================
# Translation of pb11_run_all_papers.py make_jobs() into YAML.
# Each paper preserves the existing tag, label, and command structure
# while adding the new fields needed for AI deliverables.

papers:
  
  # ----------------------------------------------------------------------
  # PAPER 1 — Static p-11B baseline
  # Foundation paper. Establishes that the simulation framework works
  # and produces the basic ring-reconnection signature.
  # ----------------------------------------------------------------------
  - id: A1
    paper_num: 1
    tag: p1_static_p11b
    label: "Static ring, p-11B base only — 300T Biermann seed"
    title: "Static p-11B ring-geometry magnetic reconnection: 2D hybrid-PIC baseline"
    repo_name: "worth-paper-A1-static-pb11"
    target_journal: "Physics of Plasmas"
    status: draft
    
    simulation:
      command: "mpirun -n {mpi_ranks} python3 pb11_ring_reconnection_v12_fuel_center_outer.py --base-fuel p11b --b-seed 300 --outdir {outdir} {test_flag}"
      depends_on: []
      estimated_runtime_hours: 18
      output_dir_pattern: "runs/paper{paper_num:02d}/{mode}/{tag}"
    
    analysis:
      command: "python3 analyse_pb11.py --dir {outdir}"
      figures:
        - {name: fig1, type: fig_ring_geometry}
        - {name: fig2, type: fig_bfield_evolution}
        - {name: fig3, type: fig_xline_depletion}
        - {name: fig4, type: fig_centre_outer_energy}
        - {name: fig5, type: fig_proton_energy_distribution}
    
    drafting_context:
      tone: "technical, conservative, baseline-establishing"
      target_words: 6000
      headline_finding: "8-spot ring geometry produces sustained magnetic reconnection with centre/outer proton energy differential"
      
      key_results_to_emphasize:
        - "Centre region 95th percentile proton energy reaches >300 keV"
        - "X-line magnetic field depletes to <50% of ring zone field"
        - "Reconnection cycling persists for >25 cyclotron periods"
        - "Centre/outer energy ratio sustained at >1.8x throughout"
      
      framing:
        problem: "Thermal p-11B fusion is bremsstrahlung-limited (Rider 1995, Nevins 1998). Non-thermal acceleration mechanisms can sidestep this limit but require sustained ion energization above the cross-section threshold (500 keV minimum, 3 MeV peak)."
        contribution: "We demonstrate that 8-spot ring laser geometry with alternating-polarity Biermann battery fields produces spontaneous magnetic reconnection at midpoint X-lines, and that this reconnection accelerates protons in the convergence zone to energies approaching the p-11B fusion threshold."
        limitations: "2D Cartesian simulation; hybrid-PIC fluid electron approximation; 25 cyclotron period duration; no experimental validation; gain factor below ignition threshold without additional mechanisms."
      
      primary_application: "fusion"
      target_markets: ["fusion energy", "compact neutron sources"]
      trl_level: 3
      industry_context: "Independent demonstration of ring-reconnection as alternative to monolithic-laser approaches (HB11, Marvel) and magnetically-confined approaches (TAE)."
      
      keywords: ["p-11B fusion", "ring geometry", "magnetic reconnection", "hybrid-PIC", "non-thermal ion acceleration", "Biermann battery", "Alfvén wave", "aneutronic fusion", "WarpX"]
      subject_classifications: ["physics.plasm-ph", "physics.acc-ph"]
    
    citation_strategy:
      target_count: 30
      key_authors_to_cite:
        - "Hora, H."           # avalanche concept
        - "Labaune, C."        # pre-ionization mechanism
        - "Belyaev, V."        # X-line acceleration theory
        - "Roth, M."           # laser-driven ion acceleration
        - "Picciotto, A."      # 2014 first p-11B observation
        - "Daido, H."          # TNSA review
        - "Vay, J.-L."         # WarpX framework
        - "Drake, J."          # reconnection physics
        - "Birn, J."           # GEM challenge reconnection
      preferred_journals:
        - "Physics of Plasmas"
        - "Nature Communications"
        - "Physical Review Letters"
        - "Nuclear Fusion"
        - "Plasma Physics and Controlled Fusion"
      required_topic_coverage:
        - "p-11B fusion cross-sections"
        - "magnetic reconnection ion acceleration"
        - "hybrid-PIC simulation methodology"
        - "Biermann battery field generation"
        - "non-thermal fusion arguments"
        - "WarpX reference implementations"
      verification_strict: true
    
    deliverables:
      - manuscript
      - references
      - press_release
      - lay_summary
      - metadata
      - potential_claims
      - uniqueness_review
    
    internal_patent_strategy:
      defends_claims: [1, 2, 3, 21]
      defends_levers: []
      requires_attorney_review_before_public: false
      attorney_reviewed_date: null
      notes: "Foundation paper. Defends core ring-reconnection method claim. No new matter beyond v4 PPA."
  
  
  # ----------------------------------------------------------------------
  # PAPER 2 — Rotating modulation + frequency scan
  # Demonstrates that rotational modulation enhances energy gain at
  # specific resonance frequencies (Alfvén sub-harmonics).
  # ----------------------------------------------------------------------
  - id: A2
    paper_num: 2
    tag: p2_rotating_program
    label: "Rotating ring with frequency scan and B-seed sensitivity"
    title: "Rotational beam modulation in ring-reconnection p-11B fusion: Alfvén sub-harmonic resonance"
    repo_name: "worth-paper-A2-rotating-pb11"
    target_journal: "Physics of Plasmas"
    status: draft
    
    # Paper 2 has multiple simulation configurations; the main runner
    # iterates over them. Listed as separate sub-jobs under simulation.
    simulation:
      command: "mpirun -n {mpi_ranks} python3 pb11_ring_reconnection_v12_fuel_center_outer.py --rotate --base-fuel p11b --freq {freq} --b-seed {b_seed} --outdir {outdir} {test_flag}"
      depends_on: [p1_static_p11b]
      estimated_runtime_hours: 18
      output_dir_pattern: "runs/paper{paper_num:02d}/{mode}/{sub_tag}"
      
      # Frequency scan sub-jobs
      sub_jobs:
        - {sub_tag: "p2_static_baseline", flags_override: "--base-fuel p11b --b-seed 300", note: "Static baseline (copy of Paper 1)"}
        - {sub_tag: "p2_rotating_500MHz", freq: "500e6", b_seed: 300, note: "Primary rotating point"}
        - {sub_tag: "p2_freq_100MHz", freq: "100e6", b_seed: 300}
        - {sub_tag: "p2_freq_208MHz", freq: "208e6", b_seed: 300, note: "Predicted Alfvén sub-harmonic"}
        - {sub_tag: "p2_freq_300MHz", freq: "300e6", b_seed: 300}
        - {sub_tag: "p2_freq_416MHz", freq: "416e6", b_seed: 300, note: "Predicted Alfvén sub-harmonic"}
        - {sub_tag: "p2_freq_500MHz", freq: "500e6", b_seed: 300}
        - {sub_tag: "p2_freq_750MHz", freq: "750e6", b_seed: 300}
        - {sub_tag: "p2_freq_1000MHz", freq: "1000e6", b_seed: 300}
        # B-seed sensitivity sub-jobs
        - {sub_tag: "p2_bseed_100T", flags_override: "--base-fuel p11b --b-seed 100"}
        - {sub_tag: "p2_bseed_150T", flags_override: "--base-fuel p11b --b-seed 150"}
        - {sub_tag: "p2_bseed_200T", flags_override: "--base-fuel p11b --b-seed 200"}
        - {sub_tag: "p2_bseed_300T", flags_override: "--base-fuel p11b --b-seed 300"}
        - {sub_tag: "p2_bseed_400T", flags_override: "--base-fuel p11b --b-seed 400"}
    
    analysis:
      command: "python3 pb11_analyse_rotating.py"
      figures:
        - {name: fig1, type: fig_ring_geometry}
        - {name: fig2, type: fig_bfield_evolution, run_filter: "p2_rotating_500MHz"}
        - {name: fig3, type: fig_xline_depletion, run_filter: "p2_rotating_500MHz"}
        - {name: fig4, type: fig_centre_outer_energy, run_filter: "p2_rotating_500MHz"}
        - {name: fig5, type: fig_frequency_response}
        - {name: fig6, type: fig_b_seed_sensitivity}
    
    drafting_context:
      tone: "technical, demonstrates resonance phenomenon"
      target_words: 7500
      headline_finding: "Rotating beam modulation at Alfvén sub-harmonic frequencies (208 and 416 MHz) enhances centre proton energy by 1.8-2.3x over static baseline"
      
      key_results_to_emphasize:
        - "500 MHz rotation produces 469.9 keV centre 95th percentile vs 237.0 keV for static"
        - "Resonance peaks observed at 208 MHz and 416 MHz consistent with Alfvén sub-harmonic prediction"
        - "Energy enhancement persists across B-seed range 100-400 T"
        - "Centre/outer ratio peaks at 1.98x in rotating case"
      
      framing:
        problem: "Static ring reconnection produces some ion acceleration but plateaus below the p-11B threshold. The question is whether dynamic modulation can enhance acceleration through resonant coupling to natural plasma frequencies."
        contribution: "We demonstrate that rotating the beam modulation at frequencies near the Alfvén sub-harmonics (208 and 416 MHz for our parameters) produces enhanced centre proton energy compared to static operation, with peak enhancement ~2x. The enhancement is robust across the experimentally-plausible Biermann battery field range (100-400 T)."
        limitations: "2D simulation; intra-pulse modulation idealized; experimental implementation requires kHz-rate AOD or similar; secondary heating mechanisms not modeled."
      
      primary_application: "fusion"
      target_markets: ["fusion energy"]
      trl_level: 3
      industry_context: "First demonstration of resonant enhancement in ring-reconnection geometry. Implementation route via AOD with stepped pseudo-rotation makes this commercially accessible."
      
      keywords: ["p-11B fusion", "rotational modulation", "Alfvén resonance", "ring reconnection", "frequency scan", "magnetic reconnection", "non-thermal fusion"]
      subject_classifications: ["physics.plasm-ph", "physics.acc-ph"]
    
    citation_strategy:
      target_count: 35
      key_authors_to_cite:
        - "Hora, H."
        - "Labaune, C."
        - "Belyaev, V."
        - "Roth, M."
        - "Picciotto, A."
        - "Daido, H."
        - "Vay, J.-L."
        - "Drake, J."
        - "Cole, A."          # Alfvén wave acceleration
        - "Hasegawa, A."      # Alfvén physics
      preferred_journals:
        - "Physics of Plasmas"
        - "Nature Communications"
        - "Physical Review Letters"
      required_topic_coverage:
        - "Alfvén wave physics"
        - "magnetic reconnection acceleration"
        - "rotational laser modulation"
        - "p-11B fusion mechanisms"
        - "hybrid-PIC simulation"
      verification_strict: true
    
    deliverables:
      - manuscript
      - references
      - press_release
      - lay_summary
      - industry_brief
      - metadata
      - potential_claims
      - licensing_targets
      - valuation
      - uniqueness_review
    
    internal_patent_strategy:
      defends_claims: [4, 5, 6, 9, 10]
      defends_levers: []
      requires_attorney_review_before_public: false
      notes: "Defends rotational modulation claims. Resonance result is foundational to the rotation-enhancement claim family."
  
  
  # ----------------------------------------------------------------------
  # PAPER 3 — Central rod fuel target
  # Tests yield enhancement from a central rod of fuel-rich material.
  # ----------------------------------------------------------------------
  - id: A3
    paper_num: 3
    tag: p3_central_rod
    label: "Central rod fuel target with density and composition scan"
    title: "Central rod fuel injection in ring-reconnection p-11B fusion: density and composition scan"
    repo_name: "worth-paper-A3-rod-pb11"
    target_journal: "Physics of Plasmas"
    status: draft
    
