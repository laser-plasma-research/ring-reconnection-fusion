  # ----------------------------------------------------------------------
  # PAPER 4 — Outer ring catcher geometry
  # ----------------------------------------------------------------------
  - id: A4
    paper_num: 4
    tag: p4_outer_ring
    label: "Outer ring catcher geometry comparison"
    title: "Outer ring catcher geometries in ring-reconnection p-11B fusion"
    repo_name: "worth-paper-A4-outer-ring-pb11"
    target_journal: "Physics of Plasmas"
    status: draft
    
    simulation:
      command: "mpirun -n {mpi_ranks} python3 pb11_ring_reconnection_v12_fuel_center_outer.py --base-fuel p11b --b-seed 300 --outdir {outdir} {test_flag}"
      depends_on: [p1_static_p11b]
      estimated_runtime_hours: 18
      output_dir_pattern: "runs/paper{paper_num:02d}/{mode}/{sub_tag}"
      sub_jobs:
        - {sub_tag: "p4_ring_inner", flags_override: "--base-fuel p11b --fuel-ring-inner --ring-fuel p11b --ring-density 5e24"}
        - {sub_tag: "p4_ring_outer", flags_override: "--base-fuel p11b --fuel-ring-outer --ring-fuel p11b --ring-density 5e24"}
        - {sub_tag: "p4_ring_full", flags_override: "--base-fuel p11b --fuel-ring-full --ring-fuel p11b --ring-density 5e24"}
        - {sub_tag: "p4_radius_900um", flags_override: "--base-fuel p11b --fuel-ring-full --ring-fuel p11b --outer-radius-um 900 --ring-density 5e24"}
        - {sub_tag: "p4_radius_1050um", flags_override: "--base-fuel p11b --fuel-ring-full --ring-fuel p11b --outer-radius-um 1050 --ring-density 5e24"}
        - {sub_tag: "p4_radius_1200um", flags_override: "--base-fuel p11b --fuel-ring-full --ring-fuel p11b --outer-radius-um 1200 --ring-density 5e24"}
        - {sub_tag: "p4_radius_1500um", flags_override: "--base-fuel p11b --fuel-ring-full --ring-fuel p11b --outer-radius-um 1500 --ring-density 5e24"}
    
    analysis:
      command: "python3 analyse_pb11.py --dir {outdir}"
      figures:
        - {name: fig1, type: fig_ring_geometry}
        - {name: fig2, type: fig_outer_ring_comparison}
        - {name: fig3, type: fig_density_profile}
        - {name: fig4, type: fig_centre_outer_energy}
    
    drafting_context:
      tone: "technical, geometry comparison"
      target_words: 6500
      headline_finding: "Full outer ring catcher annulus produces highest yield; inner-face geometry inadequate"
      
      key_results_to_emphasize:
        - "Full annulus catcher captures highest fraction of accelerated ions"
        - "Optimal radius 1050 um matches initial ring spacing"
        - "Radii beyond 1200 um lose containment"
      
      framing:
        problem: "Ions accelerated outward from X-lines can be captured by an outer ring catcher to provide a secondary fuel population. The geometry of this catcher determines capture efficiency and overall yield."
