name: plasma
# ============================================================================
# Cloud-targeted plasma environment for laser-plasma-research
#
# Designed for: Linux x86_64 with NVIDIA GPU (CUDA 12.x)
# Installs WarpX with CUDA backend for GPU-accelerated hybrid-PIC simulations.
#
# History:
#   The original environment.yml was a mamba export of the macOS Mac
#   development environment. It pinned exact versions and included
#   macOS-specific packages (pyobjc-*, appnope) that fail on Linux.
#   This file is the Linux-CUDA equivalent, with looser version constraints
#   that let conda resolve the latest compatible builds.
#
# Usage on a fresh cloud Ubuntu 22.04+ instance:
#   mamba env create -f environment.yml
#   mamba activate plasma
#   python -c "import pywarpx; print(pywarpx.__version__)"
#
# To verify CUDA support after install:
#   ls $(python -c "import pywarpx, os; print(os.path.dirname(pywarpx.__file__))")
#   The .so files should have 'cuda' in their names (e.g. warpx_pybind_2d.cuda.so)
# ============================================================================

channels:
  - conda-forge

dependencies:
  - python=3.11

  # ── Simulation core ───────────────────────────────────────────────────────
  # Use unconstrained warpx — let conda solve for the latest CUDA build.
  # If conda picks a CPU build, override explicitly with: warpx=*=*cuda*
  - warpx=*=*cuda*
  - amrex=*=*cuda*
  - pyamrex
  - picmistandard

  # ── MPI (CUDA-aware where available) ──────────────────────────────────────
  - openmpi=*=*cuda*
  - mpi4py

  # ── Diagnostic data formats ───────────────────────────────────────────────
  - openpmd-api
  - openpmd-viewer
  - h5py
  - adios2

  # ── Numerical / scientific stack ──────────────────────────────────────────
  - numpy
  - scipy
  - matplotlib
  - sympy
  - mpmath

  # ── Workflow / orchestrator dependencies ──────────────────────────────────
  - pyyaml
  - dill
  - tqdm
  - psutil
  - requests
  - jinja2

  # ── Periodic table (used by WarpX species lookups) ────────────────────────
  - periodictable

  # ── Build / system utilities ──────────────────────────────────────────────
  - pip

  # ── Pip-installed packages (for orchestrator drafting via Anthropic API) ──
  - pip:
      - anthropic
      - annotated-types
      - pydantic
      - pydantic-core
      - distro
      - docstring-parser
      - jiter
      - typing-inspection
